name: Build, Push, and GitOps Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
      - 'scripts/ci/**'

permissions:
  id-token: write
  contents: write

# CI 이미지/manifest 갱신 직렬화. 인프라 변경/teardown은 별도 운영자가 수행한다.
concurrency:
  group: app-images-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  # The account ID lives only in the repository secret AWS_ACCOUNT_ID, so it is masked in logs
  # and never committed. The registry is used for publishing only; Git records just the SHA tag.
  ROLE_TO_ASSUME: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eks-deploy-role
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
  SOURCE_SHA: ${{ github.sha }}

jobs:
  build-and-deploy:
    if: vars.ENABLE_AWS_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the account secret
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "Repository secret AWS_ACCOUNT_ID is missing or not a 12-digit account ID." >&2
            exit 1
          fi

      - name: Set up QEMU (for linux/amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify source commit and unused SHA tags
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          bash scripts/ci/publish-images.sh check

      - name: Build WAS Image (local load for scan)
        uses: docker/build-push-action@v5
        with:
          build-args: SOURCE_SHA=${{ env.SOURCE_SHA }}
          context: ./app/coupang_eats_backend_v2
          platforms: linux/amd64
          load: true
          tags: ${{ env.ECR_REGISTRY }}/was:${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build WEB Image (local load for scan)
        uses: docker/build-push-action@v5
        with:
          build-args: SOURCE_SHA=${{ env.SOURCE_SHA }}
          context: ./app/coupang_eats_frontend_v2
          platforms: linux/amd64
          load: true
          tags: ${{ env.ECR_REGISTRY }}/web:${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan WAS image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          image-ref: ${{ env.ECR_REGISTRY }}/was:${{ env.SOURCE_SHA }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan WEB image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          image-ref: ${{ env.ECR_REGISTRY }}/web:${{ env.SOURCE_SHA }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push scanned images without rebuilding
        id: publish
        run: bash scripts/ci/publish-images.sh publish

      - name: Install Kustomize
        if: github.ref == 'refs/heads/main'
        env:
          KUSTOMIZE_VERSION: '5.8.1'
        run: |
          mkdir -p "$RUNNER_TEMP/kustomize-bin"
          curl -fLsS "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/kustomize.tar.gz"
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP/kustomize-bin" kustomize
          echo "$RUNNER_TEMP/kustomize-bin" >> "$GITHUB_PATH"

      - name: Commit and push dev manifest (main only)
        if: github.ref == 'refs/heads/main'
        env:
          WAS_DIGEST: ${{ steps.publish.outputs.was_digest }}
          WEB_DIGEST: ${{ steps.publish.outputs.web_digest }}
        run: bash scripts/ci/commit-dev-images.sh

      - name: Slack notify
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_ALERT_TAGS: ${{ secrets.SLACK_ALERT_TAGS }}
          STATUS: ${{ job.status }}
          ENV_TAG: ${{ github.ref_type == 'tag' && 'image-only' || 'dev' }}
          PROJECT_TAG: food-delivery
          TITLE: "CI/CD ${{ job.status }} — ${{ github.repository }}"
          TEXT: "Branch/Tag: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\nActor: `${{ github.actor }}`\nRef type: `${{ github.ref_type }}`"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x .github/scripts/slack_notify.sh
          if [ "$STATUS" = "success" ]; then
            export SLACK_ALERT_TAGS=""
          else
            export SLACK_ALERT_TAGS="${SLACK_ALERT_TAGS:-<!here>}"
          fi
          .github/scripts/slack_notify.sh
