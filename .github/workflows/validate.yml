name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Kustomize
        env:
          KUSTOMIZE_VERSION: '5.8.1'
        run: |
          mkdir -p "$RUNNER_TEMP/kustomize-bin"
          cd "$RUNNER_TEMP/kustomize-bin"
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          archive="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$base/$archive" -o "$archive"
          curl -fsSL "$base/checksums.txt" -o checksums.txt
          sha256sum --ignore-missing --check checksums.txt
          tar -xzf "$archive" kustomize
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Scan public identifiers
        run: python scripts/ci/check-public-identifiers.py
      - name: Check deployment and teardown contracts
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest \
            test_argocd_application \
            test_safe_teardown \
            test_r2_target \
            test_public_identifiers \
            test_karpenter_iam.IAMContracts \
            test_karpenter_iam.HelmContracts.test_existing_and_new_dependency_gates
          ruby scripts/ci/image-traceability-test.rb
      - name: Scan commit history for secrets
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          cd "$RUNNER_TEMP/gitleaks-bin"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$base/$archive" -o "$archive"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          sha256sum --ignore-missing --check checksums.txt
          tar -xzf "$archive" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact=100 --no-banner

  application:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    defaults:
      run:
        working-directory: app/coupang_eats_${{ matrix.component }}_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/coupang_eats_${{ matrix.component }}_v2/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Backend security and lifecycle tests
        if: matrix.component == 'backend'
        run: npm test -- --runInBand --testPathPatterns='core/(rate-limit|logger|health|notification)'
      - name: Frontend lint
        if: matrix.component == 'frontend'
        run: npm run lint
