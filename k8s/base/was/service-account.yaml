apiVersion: v1
kind: ServiceAccount
metadata:
  name: food-delivery-was
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/audience: sts.amazonaws.com
# Disable the general Kubernetes API token; EKS IRSA webhook projects a
# separate sts.amazonaws.com token when the overlay supplies the IAM role ARN.
automountServiceAccountToken: false
