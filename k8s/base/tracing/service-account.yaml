apiVersion: v1
kind: ServiceAccount
metadata:
  name: adot-collector
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/audience: sts.amazonaws.com
# IRSA admission projects a separate STS token; no general API token is needed.
automountServiceAccountToken: false
