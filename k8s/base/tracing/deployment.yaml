apiVersion: apps/v1
kind: Deployment
metadata:
  name: adot-collector
  namespace: app
  labels: {app: adot-collector}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: adot-collector}
  template:
    metadata:
      labels: {app: adot-collector}
    spec:
      serviceAccountName: adot-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.50.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/collector.yaml"]
          env:
            - {name: AWS_REGION, value: ap-northeast-2}
            - {name: AWS_DEFAULT_REGION, value: ap-northeast-2}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
            - {name: AWS_EC2_METADATA_DISABLED, value: "true"}
            - {name: GOMEMLIMIT, value: 180MiB}
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: otlp-http}
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
      volumes:
        - name: config
          configMap: {name: adot-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: adot-collector
  namespace: app
  labels: {app: adot-collector}
spec:
  type: ClusterIP
  selector: {app: adot-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http, protocol: TCP}
    - {name: metrics, port: 8888, targetPort: metrics, protocol: TCP}
