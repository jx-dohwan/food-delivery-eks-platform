apiVersion: v1
kind: ConfigMap
metadata:
  name: adot-collector-config
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 160
        spike_limit_mib: 32
      batch:
        timeout: 2s
        send_batch_size: 64
        send_batch_max_size: 128
    exporters:
      awsxray:
        region: ap-northeast-2
        local_mode: true
        num_workers: 2
        request_timeout_seconds: 3
        max_retries: 1
        index_all_attributes: false
        telemetry:
          enabled: false
    service:
      telemetry:
        # Internal metrics only; no span/debug payload exporter.
        logs:
          level: error
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsxray]
