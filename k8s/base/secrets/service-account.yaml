apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-service-account
  namespace: app # 리소스가 위치할 네임스페이스 지정
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # IRSA의 핵심 AWS IAM 역할과 쿠버네티스 ServiceAccount를 매핑하는 어노테이션
    # EKS OIDC 공급자가 이 어노테이션을 확인하여 AWS 임시 토큰을 파드에 주입함
    # Publish runtime_bindings from Terraform; an empty value fails preflight.
    eks.amazonaws.com/role-arn: ""
