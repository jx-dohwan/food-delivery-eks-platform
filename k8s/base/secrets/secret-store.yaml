apiVersion: external-secrets.io/v1
kind: SecretStore # 외부 비밀번호 저장소(AWS Secrets Manager)와의 통신 채널을 정의하는 리소스
metadata:
  # SecretStore의 고유 이름 (ExternalSecret 리소스가 이 이름을 참조함)
  name: aws-secrets-manager-store
  # 배포될 네임스페이스 지정
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # 연결할 외부 프로바디어 명시
  provider:
    # AWS 클라우드 공급자 설정
    aws:
      # 사용할 AWS 서비스로 Secrets Manager 선택
      service: SecretsManager
      region: ap-northeast-2
      # AWS API 호출 시 사용할 인증 방식 정의
      auth:
        # IRSA 기반의 OIDC 서명 웹 아이덴티티 토큰(jwt) 방식을 사용
        jwt:
          # 위에서 생성한 IAM Role 연동 ServiceAccount 참조
          serviceAccountRef:
            name: eso-service-account # 테라폼에서 프로비저닝된 IRSA 연동 SA
