apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: was-db-external-secret
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secrets-manager-store
    kind: SecretStore
  target:
    name: was-db-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        # 인증 Secret은 로테이션이 관리하고, 호스트만 별도 연결정보에서 읽는다.
        key: rds-aurora-credentials-connection
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: rds-aurora-credentials
        property: port
    - secretKey: DB_USERNAME
      remoteRef:
        key: rds-aurora-credentials
        property: username
    - secretKey: DB_USER_NAME
      remoteRef:
        key: rds-aurora-credentials
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: rds-aurora-credentials
        property: password
    - secretKey: DB_DATABASE
      remoteRef:
        key: rds-aurora-credentials
        property: dbname
    - secretKey: REDIS_HOST
      remoteRef:
        key: rds-aurora-credentials-connection
        property: redis_host
    - secretKey: REDIS_PORT
      remoteRef:
        key: rds-aurora-credentials-connection
        property: redis_port
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: rds-aurora-credentials
        property: jwt_access_secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: rds-aurora-credentials
        property: jwt_refresh_secret
