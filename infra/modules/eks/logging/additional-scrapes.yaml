- job_name: kubelet-volumes
  scheme: https
  metrics_path: /metrics
  kubernetes_sd_configs:
  - role: node
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    insecure_skip_verify: false
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: node
  metric_relabel_configs:
  - source_labels:
    - __name__
    regex: kubelet_volume_stats_(available|capacity)_bytes
    action: keep
  - source_labels:
    - namespace
    regex: monitoring
    action: keep
  - source_labels:
    - persistentvolumeclaim
    regex: storage-loki-.*
    action: keep
