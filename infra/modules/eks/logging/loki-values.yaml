deploymentMode: Monolithic
fullnameOverride: loki
loki:
  image:
    tag: 3.7.9
  auth_enabled: false
  analytics:
    reporting_enabled: false
  commonConfig:
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory
  schemaConfig:
    configs:
    - from: '2024-04-01'
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: RENDER-ONLY-NOT-A-BUCKET
      ruler: RENDER-ONLY-NOT-A-BUCKET
      admin: RENDER-ONLY-NOT-A-BUCKET
    s3:
      region: ap-northeast-2
      s3ForcePathStyle: false
      insecure: false
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
    ingestion_rate_mb: 1
    ingestion_burst_size_mb: 2
    per_stream_rate_limit: 256KB
    per_stream_rate_limit_burst: 512KB
    max_line_size: 16KB
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_parallelism: 2
    max_entries_limit_per_query: 2000
    discover_service_name: []
  ingester:
    chunk_idle_period: 5m
    max_chunk_age: 1h
    wal:
      enabled: true
      dir: /var/loki/wal
      replay_memory_ceiling: 256MB
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 10
    delete_request_store: s3
  querier:
    max_concurrent: 2
  readinessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    initialDelaySeconds: 30
    timeoutSeconds: 3
  livenessProbe:
    httpGet:
      path: /metrics
      port: http-metrics
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 5
  memberlistConfig:
    join_members: []
  rulerConfig:
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    rule_path: /var/loki/rules-tmp
    alertmanager_url: http://observability-alertmanager.monitoring.svc.cluster.local:9093
    enable_alertmanager_v2: true
    enable_api: false
    evaluation_interval: 30s
singleBinary:
  replicas: 1
  sidecar: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector: {}
  terminationGracePeriodSeconds: 120
  extraEnv:
  - name: AWS_EC2_METADATA_DISABLED
    value: 'true'
  - name: AWS_STS_REGIONAL_ENDPOINTS
    value: regional
  podDisruptionBudget:
    enabled: false
  persistence:
    enabled: true
    size: 8Gi
    storageClass: logging-gp3
    enableStatefulSetAutoDeletePVC: false
  extraVolumes:
  - name: alert-rules
    configMap:
      name: loki-alert-rules
  extraVolumeMounts:
  - name: alert-rules
    mountPath: /etc/loki/rules/fake
    readOnly: true
serviceAccount:
  create: true
  name: loki
  annotations: {}
  automountServiceAccountToken: false
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
sidecar:
  rules:
    enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: observability
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
rbac:
  namespaced: true
