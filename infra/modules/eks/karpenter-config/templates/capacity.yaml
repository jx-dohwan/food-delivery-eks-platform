apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.nodeClassName | default "food-delivery-app" | quote }}
  labels:
    app.kubernetes.io/part-of: food-delivery
    food-delivery/environment: {{ .Values.environment | default "dev" | quote }}
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - id: {{ required "A verified fixed EKS 1.36 AL2023 AMI ID is required" .Values.amiID | quote }}
  instanceProfile: {{ .Values.instanceProfile | quote }}
  associatePublicIPAddress: false
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
        Type: private
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 20Gi
        encrypted: true
        deleteOnTermination: true
  tags:
    {{- toYaml .Values.tags | nindent 4 }}
    food-delivery/cluster: {{ .Values.clusterName | quote }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: food-delivery-app
  labels:
    app.kubernetes.io/part-of: food-delivery
    food-delivery/environment: {{ .Values.environment | default "dev" | quote }}
spec:
  template:
    metadata:
      labels:
        food-delivery/capacity: application
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ .Values.nodeClassName | default "food-delivery-app" | quote }}
      expireAfter: 168h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: [t3, t3a]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [medium, large]
  limits:
    cpu: "4"
    memory: 8Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
