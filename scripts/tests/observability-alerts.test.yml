rule_files:
- observability-rules.generated.yaml
evaluation_interval: 30s
tests:
- name: response_ratio_empty
  interval: 30s
  input_series: []
  promql_expr_test:
  - expr: ((sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*",status_code=~"5.."}[2m]))
      or (0 * sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*"}[2m]))))
      / sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*"}[2m])))
      and (sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*"}[2m]))
      > 0)
    eval_time: 2m
    exp_samples: []
- name: response_ratio_zero
  interval: 30s
  input_series:
  - series: food_delivery_http_requests_total{namespace="app",pod="was-a",status_code="200"}
    values: 0+0x5
  promql_expr_test:
  - expr: ((sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*",status_code=~"5.."}[2m]))
      or (0 * sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*"}[2m]))))
      / sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*"}[2m])))
      and (sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*"}[2m]))
      > 0)
    eval_time: 2m
    exp_samples: []
- name: response_ratio_healthy
  interval: 30s
  input_series:
  - series: food_delivery_http_requests_total{namespace="app",pod="was-a",status_code="200"}
    values: 0+5x5
  promql_expr_test:
  - expr: ((sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*",status_code=~"5.."}[2m]))
      or (0 * sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*"}[2m]))))
      / sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*"}[2m])))
      and (sum(rate(food_delivery_http_requests_total{namespace=~"app",pod=~"was-.*"}[2m]))
      > 0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 0
- name: partial_reader_failure
  interval: 30s
  input_series:
  - series: up{job="alloy",instance="a"}
    values: 1+0x8
  - series: up{job="alloy",instance="b"}
    values: 0+0x8
  alert_rule_test:
  - eval_time: 3m
    alertname: ScrapeFailed
    exp_alerts:
    - exp_labels:
        job: alloy
        instance: b
        severity: warning
        environment: dev
      exp_annotations:
        summary: ScrapeFailed
        owner: project-operator
        runbook_id: observability-triage
        target: dev/observability
- name: no_scrape_not_healthy
  interval: 30s
  input_series: []
  alert_rule_test:
  - eval_time: 3m
    alertname: WASMetricsMissing
    exp_alerts:
    - exp_labels:
        severity: critical
        environment: dev
        service: nest
      exp_annotations:
        summary: WASMetricsMissing
        owner: project-operator
        runbook_id: observability-triage
        target: dev/was
- name: pressure_then_recovery
  interval: 30s
  input_series:
  - series: kube_node_status_condition{node="a",condition="DiskPressure",status="true"}
    values: 1+0x8 0+0x8
  alert_rule_test:
  - eval_time: 3m
    alertname: NodePressure
    exp_alerts:
    - exp_labels:
        node: a
        condition: DiskPressure
        status: 'true'
        severity: warning
        environment: dev
      exp_annotations:
        summary: NodePressure
        owner: project-operator
        runbook_id: observability-triage
        target: dev/observability
  - eval_time: 6m
    alertname: NodePressure
    exp_alerts: []
- name: 5xx_observed_auth_failures_not_server_errors
  interval: 30s
  input_series:
  - series: food_delivery_http_requests_total{namespace="app",status_code="401"}
    values: 0+2x8
  - series: food_delivery_http_requests_total{namespace="app",status_code="403"}
    values: 0+2x8
  - series: food_delivery_http_requests_total{namespace="app",status_code="429"}
    values: 0+2x8
  alert_rule_test:
  - eval_time: 3m
    alertname: WASHTTPServerErrors
    exp_alerts: []
- name: actual_5xx_counter
  interval: 30s
  input_series:
  - series: food_delivery_http_requests_total{namespace="app",status_code="500"}
    values: 0 0 1+0x8
  alert_rule_test:
  - eval_time: 3m
    alertname: WASHTTPServerErrors
    exp_alerts:
    - exp_labels:
        severity: warning
        environment: dev
        service: was
        namespace: app
        alert_family: was-errors
      exp_annotations:
        summary: Completed WAS 5xx responses observed; inspect dependency events and
          traces
        owner: project-operator
        runbook_id: observability-triage
        target: dev/was
- name: collector_export_failed_real_metric_name
  interval: 30s
  input_series:
  - series: otelcol_exporter_send_failed_spans{namespace="app",exporter="awsxray"}
    values: 0 0 1+0x8
  alert_rule_test:
  - eval_time: 4m
    alertname: ADOTExporterFailed
    exp_alerts:
    - exp_labels:
        severity: warning
        environment: dev
      exp_annotations:
