- name: sli_critical_and_warning_for_duration
  interval: 30s
  input_series:
  - series: food_delivery_http_requests_total{namespace="app",status_code="200"}
    values: 0+18x30
  - series: food_delivery_http_requests_total{namespace="app",status_code="500"}
    values: 0+2x30
  alert_rule_test:
  - eval_time: 2m
    alertname: WASHTTPErrorRatioCritical
    exp_alerts: []
  - eval_time: 8m
    alertname: WASHTTPErrorRatioCritical
    exp_alerts:
    - exp_labels:
        severity: critical
        environment: dev
        service: was
        alert_family: was-errors
        namespace: app
      exp_annotations: &id002
        summary: WAS 5xx ratio exceeds 5 percent with at least 100 responses in 5
          minutes
        owner: project-operator
        runbook_id: observability-triage
        target: dev/was
  - eval_time: 10m
    alertname: WASHTTPErrorRatioHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        environment: dev
        service: was
        alert_family: was-errors
        namespace: app
      exp_annotations: &id001
        summary: WAS 5xx ratio exceeds 1 percent with at least 100 responses in 5
          minutes
        owner: project-operator
        runbook_id: observability-triage
        target: dev/was
